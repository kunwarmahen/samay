[project]
name = "samay"
version = "0.1.0"
description = "samay -- the clock that asks your agent to do something later, and keeps the receipts"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# No dependencies, on purpose: Samay starts Yantra as a program and reads
# the JSON it prints, so it never imports the framework it schedules.
dependencies = []

[project.scripts]
samay = "samay.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samay"]

[tool.ruff]
line-length = 100          # prose wraps near 79; this is the HARD ceiling
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
